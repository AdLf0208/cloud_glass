id = "cloudglass"
name = "Cloud Glass"
version = "0.2.2"
description = """Sixteen semi-transparent, no-collision decorative cloud glass blocks, one per vanilla dye colour, with their wool and dye recipes."""
authors = ["Mrbysco (upstream)", "Horizon native mod contributors"]
# The SDK package (mod API 0.2): one flat .hmod carrying the blocks in data/ and assets/,
# and the carried colour-registry model in src/. The id is the resource namespace and the
# only identity.
api = "0.2"
side = "both"
# Required by the manifest schema even though this package registers nothing from Rust:
# the blocks are content declarations, and the check report's own `capabilities` is empty.
capabilities = ["registries"]
license = "MIT"
homepage = "https://github.com/Mrbysco/CloudGlass"
issues = "https://github.com/Mrbysco/CloudGlass/issues"

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
